name: Setup ROCm build dependencies
description: Install common apt packages used by ROCm CI container jobs.

inputs:
  apt-packages:
    description: Whitespace-separated apt packages to install.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install requested apt packages
      shell: bash
      run: |
        apt-get update
        if [ -n "${APT_PACKAGES}" ]; then
          apt-get install -y ${APT_PACKAGES}
        fi
      env:
        APT_PACKAGES: ${{ inputs.apt-packages }}
