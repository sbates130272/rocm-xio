name: scripts-check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'debian/**/*.sh'
      - 'grafana/**/*.sh'
      - 'kernel/**/*.sh'
      - 'rdma-core/**/*.sh'
      - 'scripts/**'
      - 'tests/**/*.sh'
      - 'udev/**/*.sh'
      - '.github/workflows/scripts-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
    - name: Check out code.
      uses: actions/checkout@v5.0.0
    - name: Install ShellCheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
    - name: Run ShellCheck
      run: |
        git ls-files '*.sh' | xargs -r shellcheck --severity=warning
      env:
        SHELLCHECK_OPTS: --exclude=SC2086
