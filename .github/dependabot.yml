# Dependabot keeps third-party GitHub Actions and Python doc tooling
# fresh.  Updates are grouped so contributors get one weekly PR per
# ecosystem instead of one PR per dependency.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /docs/sphinx
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - docs
    commit-message:
      prefix: docs
      include: scope
    groups:
      sphinx-toolchain:
        update-types:
          - minor
          - patch
