# Example: build rocm-xio + fio on a ROCm-capable Ubuntu host.
#
#   ansible-playbook -i inventory ansible/build_rocm_xio_fio.yml \
#     -e rocm_xio_git_repo=https://github.com/ROCm/rocm-xio.git \
#     -e rocm_xio_git_ref=dev/stebates/nvme-ep-fio-api

- name: Build rocm-xio and fio with rocm_xio engine
  hosts: all
  gather_facts: true
  roles:
    - role: rocm_xio_fio
