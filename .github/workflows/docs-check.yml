name: docs-check

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - 'feat/**'
    paths:
      - 'docs/**'
      - 'cmake/XIODocumentation.cmake'
      - 'requirements.txt'
      - '.readthedocs.yaml'
      - 'src/**/*.h'
      - 'README.md'
      - '.codespellrc'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sphinx:
    name: sphinx-build
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Check out code.
      uses: actions/checkout@v5.0.0
      with:
        persist-credentials: false
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake doxygen python3-venv
        python -m pip install -r docs/sphinx/requirements.txt
    - name: Configure docs-only build
      run: |
        cmake -S . -B build \
          -DXIO_DOCS_ONLY=ON \
          -DXIO_BUILD_DOCS=ON
    - name: Build documentation
      run: cmake --build build --target sphinx-html

  codespell:
    name: codespell
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code.
      uses: actions/checkout@v5.0.0
      with:
        persist-credentials: false
    - name: Install codespell
      run: python -m pip install 'codespell==2.3.0'
    - name: Run codespell
      run: codespell

  rst-lint:
    name: rst-lint
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code.
      uses: actions/checkout@v5.0.0
      with:
        persist-credentials: false
    - name: Install doc8
      run: python -m pip install 'doc8==1.1.2'
    - name: Lint RST files
      run: >
        doc8 docs/ --max-line-length 80
        --ignore-path docs/sphinx/requirements.txt
