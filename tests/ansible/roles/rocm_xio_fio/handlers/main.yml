---
- name: Reload udev
  become: true
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false
  listen: "rocm_xio_udev_changed"

- name: Trigger udev
  become: true
  ansible.builtin.command: udevadm trigger
  changed_when: false
  listen: "rocm_xio_udev_changed"

- name: Run depmod
  become: true
  ansible.builtin.command: depmod -a
  changed_when: false
  listen: "rocm_xio_kmod_changed"
