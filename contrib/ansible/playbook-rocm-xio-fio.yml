# Sample playbook: build rocm-xio + fio with rocm_xio on localhost.
#
#   cd contrib/ansible
#   ansible-playbook -i localhost, -c local -K playbook-rocm-xio-fio.yml
#
# Override Git refs or prefix with -e, for example:
